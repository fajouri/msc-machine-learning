name: M5 student notebook templates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r templates/notebook/requirements-validation.txt
      - run: python -m pip check
      - name: Run all contract regressions and require notebook test discovery
        shell: python
        run: |
          import unittest
          loader = unittest.TestLoader()
          notebooks = loader.discover('tests', pattern='test_notebook_templates.py')
          assert notebooks.countTestCases() >= 10 and not loader.errors
          suite = unittest.TestLoader().discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
      - run: python -s templates/notebook/validate.py --execute
      - run: python -s templates/lecture/validate.py
      - run: python -s curriculum/validate_traceability.py
      - run: python -s curriculum/validate_curriculum.py
      - run: python -s curriculum/validate_delivery.py
      - run: python -s references/validate_bibliography.py
      - run: git diff --exit-code
