name: M5 lecture source contracts

on:
  pull_request:
    paths:
      - 'templates/lecture/**'
      - 'tests/test_lecture_templates.py'
      - 'curriculum/**'
      - 'references/**'
      - '.github/workflows/lecture-templates.yml'
  push:
    branches: [master]
    paths:
      - 'templates/lecture/**'
      - 'tests/test_lecture_templates.py'
      - 'curriculum/**'
      - 'references/**'
      - '.github/workflows/lecture-templates.yml'

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -s templates/lecture/validate.py
      - name: Run lecture tests and require discovery
        shell: python
        run: |
          import sys
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover('tests', pattern='test_lecture_templates.py')
          count = suite.countTestCases()
          if loader.errors or count < 17:
              sys.exit(f'Expected at least 17 lecture tests; discovered {count}. {loader.errors}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
