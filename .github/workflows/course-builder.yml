name: M5 course builder checks

on:
  pull_request:
    paths:
      - 'skills/msc-course-builder/**'
      - 'docs/**'
      - 'curriculum/**'
      - 'references/**'
      - 'AGENTS.md'
      - 'tests/test_course_builder.py'
      - '.github/workflows/course-builder.yml'
  push:
    branches: [master]
    paths:
      - 'skills/msc-course-builder/**'
      - 'docs/**'
      - 'curriculum/**'
      - 'references/**'
      - 'AGENTS.md'
      - 'tests/test_course_builder.py'
      - '.github/workflows/course-builder.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -s -m unittest discover -s tests -p "test_course_builder.py" -v
