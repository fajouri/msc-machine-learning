name: Bibliography audit

on:
  pull_request:
    paths:
      - 'references/**'
      - 'tests/test_bibliography.py'
      - '.github/workflows/bibliography.yml'
  push:
    branches: [master]
    paths:
      - 'references/**'
      - 'tests/test_bibliography.py'
      - '.github/workflows/bibliography.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate registered bibliography entries (audit mode)
        run: python -s references/validate_bibliography.py
      - name: Run bibliography regression tests
        run: python -s -m unittest discover -s tests -p "test_bibliography.py" -v
