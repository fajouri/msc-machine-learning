name: Curriculum workload validation

on:
  pull_request:
    paths:
      - 'curriculum/**'
      - 'docs/PRODUCTION_PLAN.md'
      - 'tests/test_curriculum.py'
      - '.github/workflows/curriculum.yml'
  push:
    branches: [master]
    paths:
      - 'curriculum/**'
      - 'docs/PRODUCTION_PLAN.md'
      - 'tests/test_curriculum.py'
      - '.github/workflows/curriculum.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -s curriculum/validate_curriculum.py
      - run: python -s -m unittest discover -s tests -p "test_curriculum.py" -v
